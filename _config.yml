####################################################
### Jekyll Configuration. No need to touch this. ###
####################################################

# Set the Sass partials directory, as we're using @imports
sass:
  style: :compressed # You might prefer to minify using :compressed

# Exclude these files from your production _site
exclude:
  - LICENSE
  - README.md
  - CNAME
  - CLAUDE.md

include:
  - ".well-known"

collections:
  pages:
    output: true
    permalink: /:path
  guides:
    output: true
    permalink: /guides/:slug

defaults:
  - scope:
      path: ""
      type: "guides"
    values:
      layout: "guide"

# Publish documents whose date is in the future (no scheduled releases here).
future: true

# Markdown rendering
markdown: kramdown

# Plugins
plugins:
  - jekyll-sitemap
