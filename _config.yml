# Font Awesome v5 Icons used: https://fontawesome.com/v5/search

# Feature List                            Edit, add or remove features to be presented.
features                                  :
  - title                                 : Big Buttons
    description                           : The big buttons make it perfect for driving or on the go, ensuring easy and safe interaction with your music player.
    fontawesome_icon_name                 : hand-pointer

  - title                                 : Adaptive Album Themes
    description                           : Experience dynamic themes that adapt to your music's album artwork, creating a personalized visual experience.
    fontawesome_icon_name                 : palette

  - title                                 : Custom Color Themes
    description                           : Personalize your music player with custom color themes to match your style and preferences.
    fontawesome_icon_name                 : paint-brush

  - title                                 : Accessibility Support
    description                           : Designed with accessibility in mind, ensuring everyone can enjoy their media library with ease.
    fontawesome_icon_name                 : universal-access

  - title                                 : Music Library Sync
    description                           : Seamlessly sync your music library to enjoy offline playback, ensuring your favorite tunes are always available, even without an internet connection.
    fontawesome_icon_name                 : sync

  - title                                 : Indie Developed
    description                           : Created with passion and attention to detail by independent developers who care about the user experience.
    fontawesome_icon_name                 : code

