# Font Awesome v5 Icons used: https://fontawesome.com/v5/search

# Feature List                            Edit, add or remove features to be presented.
features                                  :
  - title                                 : One Player, Two Libraries
    description                           : Your iPhone library and Apple Music in one player and one queue. Two tabs at the top, finally on level ground.
    fontawesome_icon_name                 : layer-group

  - title                                 : Mesh Album Backgrounds
    description                           : Beautiful mesh gradients drawn from your album art, so every track has its own atmosphere.
    fontawesome_icon_name                 : palette

  - title                                 : Glass Mini Player
    description                           : A floating glass mini player, reachable from every screen. Tap to expand into the full-screen player with big buttons.
    fontawesome_icon_name                 : hand-pointer

  - title                                 : Unified Search
    description                           : One search across your library and Apple Music. Songs, albums, artists and playlists grouped into a single result view.
    fontawesome_icon_name                 : magnifying-glass

  - title                                 : Rich Artist Pages
    description                           : Play, Shuffle, Station, top songs, full discography and related artists, with album detail and track lists.
    fontawesome_icon_name                 : compact-disc

  - title                                 : Indie Developed
    description                           : Built by one developer who still listens front to back. Painstakingly designed, with full accessibility support.
    fontawesome_icon_name                 : code

