<head>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title class="pageTitle">{{ site.page_title }}</title>
	<meta name="description" content="{{ site.app_description }}">
	<link rel="canonical" href="{{ page.url | absolute_url }}">

	<!-- Favicons (helps Google show the site icon in search results) -->
	<link rel="icon" type="image/png" href="{{ site.app_icon | relative_url }}">
	<link rel="apple-touch-icon" href="{{ site.app_icon | relative_url }}">
	<link rel="shortcut icon" href="{{ site.app_icon | relative_url }}">

	<!-- Smart App Banner -->
	{% if site.enable_smart_app_banner %}
		<meta name="apple-itunes-app" content="app-id={{ site.ios_app_id }}">
	{% endif %}

	<meta property="og:title" content="{{ page.og_title | default: site.page_title }}">
	<meta property="og:description" content="{{ page.og_description | default: site.app_description }}">
	<meta property="og:url" content="{{ page.url | absolute_url }}">
	<meta property="og:type" content="{{ page.og_type | default: 'website' }}">
	<meta property="og:site_name" content="{{ site.site_name }}">
	<meta property="og:image" content="{{ page.og_image | default: site.og_image }}">
	<meta property="og:image:alt" content="{{ page.og_image_alt | default: 'Stezza - Simple Music Player' }}">

	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Passion+One:wght@400;700;900&display=swap" rel="stylesheet">

	<!-- Structured data (Schema.org) — gives Google richer signals for search results -->
	<script type="application/ld+json">
	{
		"@context": "https://schema.org",
		"@graph": [
			{
				"@type": "WebSite",
				"@id": "{{ '/' | absolute_url }}#website",
				"url": "{{ '/' | absolute_url }}",
				"name": {{ site.app_name | jsonify }},
				"description": {{ site.app_description | jsonify }},
				"publisher": { "@id": "{{ '/' | absolute_url }}#organization" }
			},
			{
				"@type": "Organization",
				"@id": "{{ '/' | absolute_url }}#organization",
				"name": {{ site.your_name | jsonify }},
				"url": {{ site.your_link | jsonify }},
				"logo": {
					"@type": "ImageObject",
					"url": "{{ site.app_icon | absolute_url }}"
				}
			},
			{
				"@type": "SoftwareApplication",
				"name": {{ site.app_name | jsonify }},
				"description": {{ site.app_description | jsonify }},
				"url": "{{ '/' | absolute_url }}",
				"applicationCategory": {{ site.app_category | default: 'UtilitiesApplication' | jsonify }},
				"operatingSystem": "iOS",
				"image": "{{ site.app_icon | absolute_url }}",
				"downloadUrl": "https://apps.apple.com/{{ site.ios_app_country }}/app/id{{ site.ios_app_id }}",
				"offers": {
					"@type": "Offer",
					"price": "0",
					"priceCurrency": "USD"
				},{% if site.app_rating_value and site.app_rating_count %}
				"aggregateRating": {
					"@type": "AggregateRating",
					"ratingValue": "{{ site.app_rating_value }}",
					"ratingCount": "{{ site.app_rating_count }}"
				},{% endif %}
				"publisher": { "@id": "{{ '/' | absolute_url }}#organization" }
			}
		]
	}
	</script>

	<link rel="stylesheet" href="{{ '/main.css' | relative_url }}">

	<script>
		(function() {
			if (window.location.search.includes('inapp=true')) {
				document.documentElement.classList.add('in-app-view');
			}
		})();
	</script>
</head>
