<head>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title class="pageTitle">{{ site.page_title }}</title>
	<meta name="description" content="{{ site.app_description }}">
	<link rel="canonical" href="{{ page.url | absolute_url }}">

	<link rel="shortcut icon" href="{{ site.app_icon | relative_url }}">

	<!-- Smart App Banner -->
	{% if site.enable_smart_app_banner %}
		<meta name="apple-itunes-app" content="app-id={{ site.ios_app_id }}">
	{% endif %}

	<meta property="og:title" content="{{ page.og_title | default: site.page_title }}">
	<meta property="og:description" content="{{ page.og_description | default: site.app_description }}">
	<meta property="og:url" content="{{ page.url | absolute_url }}">
	<meta property="og:type" content="{{ page.og_type | default: 'website' }}">
	<meta property="og:site_name" content="{{ site.site_name }}">
	<meta property="og:image" content="{{ page.og_image | default: site.og_image }}">
	<meta property="og:image:alt" content="{{ page.og_image_alt | default: 'Stezza - Simple Music Player' }}">

	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Passion+One:wght@400;700;900&display=swap" rel="stylesheet">

	<link rel="stylesheet" href="{{ '/main.css' | relative_url }}">

	<script>
		(function() {
			if (window.location.search.includes('inapp=true')) {
				document.documentElement.classList.add('in-app-view');
			}
		})();
	</script>
</head>
